*{box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent}
html,body{height:100%; overscroll-behavior:none}
body{background:var(--bg); color:var(--ink); font:15px/1.45 Georgia,'Times New Roman',serif; user-select:none}

  background:radial-gradient(ellipse at 50% -10%, rgba(255,220,150,.06), transparent 60%)}
input,select,textarea,button{font:inherit; color:inherit}
input,select,textarea{background:var(--bg2); border:1px solid var(--edge); border-radius:8px; padding:8px 10px; width:100%; user-select:text}
h1,h2,h3{font-variant:small-caps; letter-spacing:.06em; font-weight:600}
h1{font-size:1.5em} h2{font-size:1.2em} h3{font-size:1.02em}
button{background:var(--panel2); border:1px solid var(--edge); border-radius:10px; padding:9px 14px; cursor:pointer; color:var(--ink); transition:filter .15s, transform .05s}
button:active{transform:scale(.97)}
button.pri{background:var(--accent2); border-color:var(--accent); color:#fff}
button.ghost{background:transparent}
button:disabled{opacity:.4}
.row{display:flex; gap:8px; align-items:center} .row.wrap{flex-wrap:wrap}
.col{display:flex; flex-direction:column; gap:8px}
.grow{flex:1} .dim{color:var(--ink-dim)} .small{font-size:.82em} .right{text-align:right}
.card{background:var(--panel); border:1px solid var(--edge); border-radius:14px; padding:12px}
hr{border:none; border-top:1px solid var(--edge); margin:8px 0}
.tag{display:inline-block; background:var(--bg2); border:1px solid var(--edge); border-radius:20px; padding:2px 10px; font-size:.8em; margin:2px}
.tag.on{border-color:var(--accent); color:var(--accent)}
#app{position:fixed; inset:0; display:flex; flex-direction:column; z-index:1}
#topbar{display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--bg2); border-bottom:1px solid var(--edge); z-index:5}

#navbar button.on{color:var(--accent); border-top-color:var(--accent); background:var(--panel)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}

.hpbar.low>div{background:linear-gradient(90deg,#7a2a22,var(--danger))}
.hpbar span{position:absolute; inset:0; text-align:center; font-size:.72em; line-height:14px; color:#fff; text-shadow:0 1px 2px #000}
.list>div{display:flex; align-items:center; gap:8px; padding:10px 6px; border-bottom:1px solid var(--edge)}
.list>div:last-child{border:none}
.pick{border:1px solid var(--edge); border-radius:12px; padding:10px; background:var(--panel); cursor:pointer}
.pick.on{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.pick b{display:block} .pick .small{color:var(--ink-dim)}
.emblem{width:56px; height:56px; border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--panel2), var(--bg2)); border:2px solid var(--accent2); display:flex; align-items:center; justify-content:center; font-size:1.7em; flex-shrink:0}

#diceLayer{position:fixed; inset:0; z-index:50; pointer-events:none; display:none; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 45%, rgba(0,0,0,.55), rgba(0,0,0,.8))}
.dice3d{width:110px; height:110px; position:relative; transform-style:preserve-3d; animation:tumble .9s cubic-bezier(.2,.7,.3,1) forwards}

@keyframes pop{from{opacity:0; transform:scale(.6)} to{opacity:1; transform:scale(1)}}
#diceLabel{position:absolute; top:18%; font-variant:small-caps; letter-spacing:.1em; color:var(--ink-dim); opacity:0; animation:pop .4s .1s forwards}
.fx{position:fixed; inset:0; pointer-events:none}
@keyframes fxFire{0%{opacity:0}20%{opacity:1}100%{opacity:0; background:radial-gradient(circle at 50% 50%, rgba(255,160,40,.55), transparent 65%)}}
@keyframes fxDark{0%{opacity:0}30%{opacity:1}100%{opacity:0; background:radial-gradient(circle at 50% 50%, rgba(20,0,0,.75), transparent 70%)}}
@keyframes fxGold{0%{opacity:0}25%{opacity:1}100%{opacity:0; background:radial-gradient(circle at 50% 50%, rgba(255,215,120,.5), transparent 60%)}}
@keyframes fxBlood{0%{opacity:0}25%{opacity:1}100%{opacity:0; background:radial-gradient(circle at 50% 50%, rgba(180,20,20,.55), transparent 65%)}}

 openModal(`<h2>Add Combatants</h2><input id="cmN" list="mnames" placeholder="Monster name (blank = just PCs)">
 <datalist id="mnames">{MONSTERS.map(m=>`<option value="{m.n}">`).join("")}</datalist>
 <input id="cmCount" type="number" value="1" min="1" style="margin-top:6px;width:80px">
 <button class="pri" onclick="addMonsters()" style="margin-top:8px">Add & Begin Initiative</button>`);
 INIT=adds;};
window.addMonsters=()=>{const n=("#cmN").value.trim(),cnt=+("#cmCount").value||1;
 if(n){const m=MONSTERS.find(x=>x.n.toLowerCase()===n.toLowerCase());
  if(!m){toast("Unknown monster — add it via Bestiary or content pack");return}
  for(let i=0;i<cnt;i++)INIT.push({name:m.n+(cnt>1?" "+(i+1):""),hp:m.hp,ac:m.ac,init:evalExpr("1d20+2").total,mref:m.n});
  netBroadcast({t:"share",data:{encounterWarn:true}});}
 sortInit();initTurnIdx=0;closeModal();pushLog("Encounter begins!");drawApp(document.getElementById("app"))};
window.combatHit=(i,d)=>{const r=INIT[i];r.hp+=d;if(r.hp>r.mhp)r.hp=r.mhp;
 if(r.hp<=0){pushLog(r.name+" falls!");INIT.splice(i,1);if(initTurnIdx>=i)initTurnIdx--}else pushUndo("Combatant HP changed",r.hp);
 save();drawApp(document.getElementById("app"))};
window.endEncounter=()=>{INIT=[];initTurnIdx=-1;pushLog("Encounter ended");render()};
window.initNext=function(){
 if(!INIT.length)return;initTurnIdx=(initTurnIdx+1)%INIT.length;
 if(initTurnIdx===0)pushLog("New round begins");
 render();};
/* convenience single helper for DM turn advance button injected below */
/* bestiary */
function drawBestiary(M){
 M.innerHTML=`<div class="col"><input id="bQ" placeholder="Search bestiary…" oninput="bestFilter(this.value)"><div id="bList" class="col">${MONSTERS.map(mCard).join("")}</div></div>`}
function mCard(m){return `<div class="pick" onclick="showMonster(this.dataset.n)" data-n="esc(m.n)"><divclass="row"><bclass="grow">{esc(m.n)}"><div class="row"><b class="grow">esc(m.n)"><divclass="row"><bclass="grow">{esc(m.n)}</b><span class="tag">CR ${m.cr}</span></div>
 <div class="small dim">HP m.hp⋅AC{m.hp} · ACm.hp⋅AC{m.ac} · ${m.atks.map(a=>a.n).join(", ")}</div></div>`}
window.bestFilter=q=>{const lq=q.toLowerCase();document.getElementById("bList").innerHTML=MONSTERS.filter(m=>m.n.toLowerCase().includes(lq)).map(mCard).join("")||'<div class="dim">None found.</div>'};
window.showMonster=n=>{const m=MONSTERS.find(x=>x.n===n);if(!m)return;
 openModal(`<h2>esc(m.n)<spanclass="tag">CR{esc(m.n)} <span class="tag">CResc(m.n)<spanclass="tag">CR{m.cr} · ${m.xp} XP</span></h2>
 <div class="grid3">{Object.entries(m.stats).map(([k,v])=>`<div class="statbox"><b>{v}</b><span class="dim">${k}</span></div>`).join("")}</div>
 <div class="card small">HP m.hp⋅AC{m.hp} · ACm.hp⋅AC{m.ac} · Speed ${m.spd}</div>
 {m.atks.map(a=>`<div class="row"><span class="grow">{esc(a.n)}</span><button class="pri" onclick="rollDice('/d\d/.test(a.d)?a.d.match(/[0−9d+\-]+/)[0]:′1d20′′,′{/d\d/.test(a.d)?a.d.match(/[0-9d+\- ]+/)[0]:'1d20'}','/d\d/.test(a.d)?a.d.match(/[0−9d+\-]+/)[0]:′1d20′′,′{esc(a.n).replace(/'/g,"")}')">🎲 ${esc(a.d)}</button></div>`).join("")}
 <hr><div class="row"><button class="pri grow" onclick="addToInit('${esc(m.n)}');closeModal()">Add to Initiative</button>
 <button class="ghost" onclick="rollDice('1d20+mod(m.stats.DEX)′,′{mod(m.stats.DEX)}','mod(m.stats.DEX)′,′{esc(m.n)} initiative') .hasOwnProperty?'':'initOnly'}" hidden>x</button></div>`);
 function _x(){}}
window.addToInit=n=>{const m=MONSTERS.find(x=>x.n===n);if(!m)return;INIT.push({name:m.n,hp:m.hp,ac:m.ac,init:0,mref:m.n});pushLog(m.n+" added to combat");toast(m.n+" added — open Combat and Start Encounter if needed")};
/* world / all-player screen */
function drawWorld(M){
 const camp=S.campaign=S.campaign||{locations:[],board:"",shownLocations:[]};
 M.innerHTML=`<div class="col">
  <div class="card"><h3>Show Board (All Players see)</h3>
   <textarea rows="3" placeholder="Description shown on every connected player screen…" onchange="setBoard(this.value)">${esc(camp.board)}</textarea>
   <div class="row"><button class="grow pri" onclick="netBroadcast({t:'flash'});pushLog('Board shared with players');toast('Broadcast to players 📡')">📡 Broadcast Board</button></div></div>
  <div class="card"><h3>Locations</h3>
   <div class="row"><input id="locN" placeholder="Location name"><button class="pri" onclick="addLoc()">＋</button></div>
   {camp.locations.map((L,i)=>`<div class="row"><span class="grow">{esc(L.name)} ${L.visible?'<span class="tag on">shared</span>':'<span class="tag">hidden</span>'}</span>
    <button onclick="toggleLoc(i)">{i})">i)">{L.visible?"Hide":"Share"}</button><button onclick="delLoc(${i})">🗑</button></div>`).join("")||'<div class="dim small">Add map/location names here, then share individually.</div>'}</div></div>`}
window.setBoard=v=>{S.campaign.board=v;save()};
window.addLoc=()=>{const n=$("#locN").value.trim();if(n)S.campaign.locations.push({name:n,visible:false}),save(),drawApp(document.getElementById("app"))};
window.toggleLoc=i=>{S.campaign.locations[i].visible=!S.campaign.locations[i].visible;save();render();netBroadcast({t:"welcome",campaign:sharedView()})};
window.delLoc=i=>{S.campaign.locations.splice(i,1);save();render()};
/* oracle (solo mode) */
function drawOracle(M){
 M.innerHTML=`<div class="col card"><h3>Solo Oracle</h3><div class="dim small">Ask a yes/no question aloud, then tap — probability weighs toward a yes:</div>
  <button class="pri" onclick="askOracle()">🔮 Ask the Oracle</button>
  <div id="oracleOut" style="font-size:1.4em;text-align:center;min-height:40px;color:var(--accent)"></div>
  <hr><h3>Random Encounter</h3><button onclick="randomEncounter()">🎲 Spawn Random Encounter</button>
  <h3 style="margin-top:8px">Random NPC</h3><button onclick="genNPC()">Generate NPC</button></div>`}
window.askOracle=()=>{$("#oracleOut").textContent=ORACLE[Math.floor(Math.random()*ORACLE.length)];pushLog("Oracle answered")};
window.genNPC=()=>{const f=p=>p[Math.floor(Math.random()*p.length)];
 const name=f(NAME_P.first)+" "+f(NAME_P.last),hooks=["owes money to the wrong people","knows a shortcut through the mountains","is secretly a retired adventurer","desperately seeks a lost sibling","guards an old family secret"];
 openModal(`<h2>NPC</h2><p><b>name</b></p><pclass="dimsmall">{name}</b></p><p class="dim small">name</b></p><pclass="dimsmall">{hooks[Math.floor(Math.random()*hooks.length)]}</p><button class="pri" onclick="closeModal()">Done</button>`)};
window.randomEncounter=()=>{const pool=MONSTERS.slice(0,18),m=pool[Math.floor(Math.random()*pool.length)];
 toast("Encounter: "+m.n+"!");pushLog("Random encounter: "+m.n);addToInit(m.n)};
/* session (connect / chat / log) */
function drawSession(M){
 const joined=!!hostConn&&hostConn.open,hosting=!!peer&&isHost;
 M.innerHTML=`<div class="col">
  ${hosting?`<div class="card" style="text-align:center"><div class="dim small">Campaign code — share with players</div>
   <div style="font-size:2.2em;letter-spacing:.35em;color:var(--accent)">${myCode||"------"}</div>
   <div class="small dim">Players tap Join Session on their home screen and enter this code.</div>
   <div class="small dim">Connections: ${conns.length}</div></div>`
  :joined?`<div class="card"><b>Connected to campaign</b> <span class="tag on">#${esc(S.inSessionCode||"")}</span></div>`
  :`<div class="row"><button class="pri grow" onclick="becomeHost()">🏰 Host Campaign (DM)</button>
    <button class="grow" onclick="playerJoin()">🔗 Join Campaign</button></div>`}
  <div class="card"><h3>Session Log</h3><div class="small" style="max-height:300px;overflow-y:auto">${S.log.map(l=>esc(l)).join("<br>")||'<span class="dim">Nothing logged yet.</span>'}</div></div></div>`}
window.becomeHost=()=>{hostSession(code=>{pushLog("Hosting campaign #"+code);render()},err=>toast("Could not start hosting"))};
// hostSession signature above takes cb only; adapt:
function becomeHostSafe(){}
/* copilot */
function drawCopilot(M){
 M.innerHTML=`<div class="col card"><h3>DM Copilot</h3>
  <input id="apiKey" placeholder="OpenAI-compatible API key (stored locally)" value="${esc(S.apiKey||"")}" onchange="S.apiKey=this.value;save()">
  <div class="dim small">Bring your own key. The copilot sees current encounter state, party HP and conditions, and can suggest checks, DCs, which dice to roll  and plot paths."</div>
  <div class="row"><input id="cpQ" class="grow" placeholder="Ask: 'party is low — what now?'" onkeydown="if(event.key==='Enter')askCopilot()"><button class="pri" onclick="askCopilot()">Ask</button></div>
  <div id="cpOut" class="small"></div>
  <hr><h3>Offline Suggestions (no key needed)</h3>
  <div class="grid2">
   <button onclick="sugCheck()">Suggest a Check</button>
   <button onclick="sugDC()">Suggest DC</button></div></div>`}
window.sugCheck=()=>{const s=["Persuasion — talking your way past a guard","Investigation — searching the room for clues","Stealth — sneaking past the patrol","Perception — noticing something hidden","Insight — reading the NPC's true intent","Survival — tracking through wilderness"];
 $("#cpOut").innerHTML="<div class='card'>"+s[Math.floor(Math.random()*s.length)]+"</div>"};
window.sugDC=()=>{const d=[["10","Easy — something most adventurers manage"],["13","Medium — requires some skill"],["15","Moderate — a real test"],["17","Hard — exceptional competence"],["20","Very hard — legendary effort"]];
 const p=d[Math.floor(Math.random()*d.length)];$("#cpOut").innerHTML="<div class='card'><b>DC "+p[0]+"</b> — "+p[1]+"</div>"};
async function askCopilot(){
 const q=$("#cpQ").value.trim();if(!q)return;
 if(!S.apiKey)return $("#cpOut").innerHTML="<div class='dim'>Add an API key above first.</div>";
 const ch=c();
 const ctx="You are an expert D&D 5e DM assistant. Current state: "+(INIT.length?"In combat: "+INIT.map(r=>r.name+" ("+r.hp+"hp)").join(", "):"No active encounter")+(ch?". Active char: "+ch.name+" Lv"+ch.level+" HP "+ch.hp+"/"+ch.hpMax:"")+". Question: "+q+". Answer concisely for a mobile screen; suggest specific checks, DCs and dice to roll.";
 $("#cpOut").innerHTML="<div class='dim'>Consulting the oracle…</div>";
 try{
  const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",
   headers:{Authorization:"Bearer "+S.apiKey,"Content-Type":"application/json"},
   body:JSON.stringify({model:"gpt-4o-mini",messages:[{role:"system",content:ctx}],max_tokens:400})});
  const j=await r.json();$("#cpOut").innerHTML="<div class='card'>"+esc(j.choices?.[0]?.message?.content||"No response").replace(/\n/g,"<br>")+"</div>";
 }catch(e){$("#cpOut").innerHTML="<div class='dim'>Request failed — check key/connection.</div>"}}
/* ---- tools / settings ---- */
function drawTools(M){
 M.innerHTML=`<div class="col card"><h3>Settings</h3>
  <h3 style="margin-top:8px">Theme</h3>
  <div class="grid3">${[["grimoire","🕯 Candlelit Grimoire"],["elven","🌿 Elven Vanguard"],["abyssal","🔥 Abyssal Ember"]].map(([id,n])=>
   `<div class="pick S.theme===id?′on′:′′"onclick="setTheme(′{S.theme===id?'on':''}" onclick="setTheme('S.theme===id?′on′:′′"onclick="setTheme(′{id}');drawApp(document.getElementById('app'))"><b>n.split("")[1]</b><divclass="smalldim">{n.split(" ")[1]}</b><div class="small dim">n.split("")[1]</b><divclass="smalldim">{n.split(" ").slice(2).join(" ")}</div></div>`).join("")}</div>
  <hr><h3>Content Packs</h3>
  <label class="pick" style="text-align:center">📂 Import purchased content files (JSON)<input type="file" accept=".json" multiple hidden onchange="importPack(this.files);this.value=''"></label>
  {(S.packs||[]).map(p=>`<span class="tag on">✓{esc(p)}</span>`).join("")||'<div class="small dim">SRD subset loaded. Import merged packs anytime.</div>'}
  <hr><h3>Ambience Mixer</h3>
  <div class="row"><input id="scN" class="grow" placeholder="Scene name (Tavern, Boss…)"><button class="pri" onclick="saveScene()">Save scene</button></div>
  <label class="pick small dim" style="text-align:center">🎵 Add audio track to library<input type="file" accept="audio/*" multiple hidden onchange="addTracks(this.files)"></label>
  <div id="mixer">${MIXER_HTML()}</div>
  <hr><h3>Data</h3>
  <div class="grid2"><button onclick="exportAll()">💾 Export All</button>
  <label class="pick" style="text-align:center;margin:0">📥 Restore Backup<input type="file" accept=".json" hidden onchange="restoreAll(this.files[0])"></label></div>
  <button class="ghost" onclick="wipe()">⚠ Erase everything</button>
  </div>`}
window.wipe=()=>{openModal("<h2>Erase all data?</h2><p class='dim small'>Characters, packs, settings — everything, permanently.</p><div class='grid2'><button class='pri' onclick=\"localStorage.removeItem('grimoire');location.reload()\">Yes, erase</button><button onclick='closeModal()'>Cancel</button></div>")};
window.restoreAll=f=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.chars){Object.assign(S,j);save();toast("Backup restored");render()}else toast("Not a valid backup")}catch(e){toast("Invalid file")}};r.readAsText(f)};
/* music */
let AUDIO=null,trkLib=[],scenes={};
const MUSIC_SCENES={tavern:{name:"Tavern"},dungeon:{name:"Dungeon"},battle:{name:"Battle"},calm:{name:"Calm"}};
window.addTracks=files=>{for(const f of files){const u=URL.createObjectURL(f);trkLib.push({name:f.name,url:u});}save();render();toast(files.length+" track(s) added")};
window.saveScene=()=>{const n=$("#scN").value.trim();if(n){scenes[n]=trkLib.map(t=>t.name);toast("Scene '"+n+"' saved")}};
window.playTrack=i=>{if(!AUDIO)AUDIO=new Audio();AUDIO.src=trkLib[i].url;AUDIO.loop=true;AUDIO.volume=.5;AUDIO.play();toast("Playing: "+trkLib[i].name)};
window.stopAudio=()=>{AUDIO&&AUDIO.pause();AUDIO=null};;
function MIXER_HTML(){
 return trkLib.map((t,i)=>`<div class="row"><span class="grow">esc(t.name)</span><buttononclick="playTrack({esc(t.name)}</span><button onclick="playTrack(esc(t.name)</span><buttononclick="playTrack({i})">▶</button></div>`).join("")+
 (trkLib.length?'<button class="ghost grow" onclick="stopAudio()">⏹ Stop music</button>':'<div class="small dim">Import DRM-free audio you own. Tracks persist for this session.</div>');
}
/* ============================== BOOT ============================== */
document.body.dataset.theme=S.theme;
render();
if('serviceWorker' in navigator){/* offline caching via hosting — optional */}
console.log("Grimoire ready.");
</script>
</body>
