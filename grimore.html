<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grimoire</title>
<style>
:root{--bg:#0e0b14;--panel:#171320;--card:#1e1828;--edge:#2e2540;--text:#e8e2f0;
--dim:#8f86a3;--accent:#c9a227;--accent2:#7c5cd6;--danger:#d64545;--ok:#3fae6a}
body[data-theme="elven"]{--bg:#0a1410;--panel:#10201a;--card:#152a22;--edge:#244437;
--text:#e4f0e8;--dim:#7fa38f;--accent:#5cbf7a;--accent2:#3d8f6e;--ok:#5cbf7a}
body[data-theme="abyssal"]{--bg:#140a0a;--panel:#241010;--card:#2c1515;--edge:#4a2222;
--text:#f0e4e0;--dim:#a38480;--accent:#e06a3a;--accent2:#a83a2a;--ok:#c9822e}
*{box-sizing:border-box;margin:0;padding:0;font-family:Georgia,serif}
body{background:var(--bg);color:var(--text);font-size:16px}
h3{color:var(--accent);font-size:1em;margin-bottom:6px}
button{background:var(--card);color:var(--text);border:1px solid var(--edge);
border-radius:10px;padding:10px 12px;font-size:.95em;cursor:pointer}
button.pri{background:linear-gradient(160deg,var(--accent),var(--accent2));
color:#141018;font-weight:bold;border:none}
button.ghost{background:none;border-color:transparent;color:var(--dim)}
button.on{border-color:var(--accent);color:var(--accent)}
input,textarea{width:100%;background:var(--panel);border:1px solid var(--edge);
color:var(--text);border-radius:10px;padding:10px;font-size:1em}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
#topbar h1{flex:1;font-size:1.25em}
#main{flex:1;padding:0 14px 90px}
#navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;
max-width:520px;display:flex;gap:4px;padding:8px;background:var(--panel);
border-top:1px solid var(--edge)}
#navbar button{flex:1;font-size:.85em;padding:10px 2px}
.card{background:var(--card);border:1px solid var(--edge);border-radius:14px;
padding:14px;margin-bottom:12px}
.col{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.small{font-size:.85em}
.dim{color:var(--dim)}
.pick{background:var(--panel);border:1.5px solid var(--edge);border-radius:12px;
padding:10px;cursor:pointer}
.pick.on{border-color:var(--accent)}
.statbox{background:var(--panel);border:1px solid var(--edge);border-radius:12px;
padding:10px 6px;text-align:center;cursor:pointer}
.statbox b{font-size:1.3em;display:block}
.statbox span{font-size:.7em;color:var(--dim)}
.hpbar{height:26px;background:var(--panel);border:1px solid var(--edge);
border-radius:13px;overflow:hidden;position:relative;margin:8px 0}
.hpbar div{height:100%;background:linear-gradient(90deg,var(--accent),var(--ok))}
.hpbar.low div{background:var(--danger)}
.hpbar span{position:absolute;inset:0;display:flex;align-items:center;
justify-content:center;font-size:.8em;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000}
.tag{display:inline-block;background:var(--panel);border:1px solid var(--edge);
border-radius:999px;padding:4px 10px;font-size:.8em;cursor:pointer;margin:2px}
.tag.on{border-color:var(--accent);color:var(--accent)}
.cond{display:inline-block;padding:4px 10px;margin:3px;border-radius:999px;
border:1px solid var(--edge);font-size:.78em;cursor:pointer;background:var(--panel)}
.cond.on{background:var(--danger);color:#fff;border-color:var(--danger)}
.list div{padding:7px 4px;border-bottom:1px solid var(--edge);cursor:pointer}
.list div:last-child{border-bottom:none}
.irow{display:flex;gap:8px;align-items:center;background:var(--card);
border:1px solid var(--edge);border-radius:12px;padding:8px;margin-bottom:6px}
.irow.act{border-color:var(--accent)}
#modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;
align-items:flex-end;z-index:50}
#modalWrap.open{display:flex}
#modalBox{background:var(--card);border-radius:18px 18px 0 0;padding:18px;
width:100%;max-width:520px;max-height:80vh;overflow-y:auto;margin:0 auto}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-80px);
background:var(--accent);color:#141018;padding:10px 18px;border-radius:999px;
font-weight:bold;z-index:99;transition:.3s}
#toast.show{transform:translateX(-50%) translateY(0)}
#rollOv{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;
flex-direction:column;align-items:center;justify-content:center;z-index:80}
#rollOv.show{display:flex}
#rollBig{font-size:4em;font-weight:bold;color:var(--accent)}
#rollLbl{color:var(--dim);margin-bottom:10px;text-align:center;padding:0 20px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalWrap" onclick="if(event.target===this)closeModal()"><div id="modalBox"></div></div>
<div id="toast"></div>
<div id="rollOv"><div id="rollLbl"></div><div id="rollBig"></div></div>
<script>
"use strict";

/* ================= DATA ================= */

deception:"CHA",history:"INT",insight:"WIS",intimidation:"CHA",investigation:"INT",

var CLASSES={
fighter:{n:"Fighter",e:"#",hd:10,saves:"STR, CON",spells:0,cast:"STR",d:"Master of weapons"},

rogue:{n:"Rogue",e:"|",hd:8,saves:"DEX, INT",spells:0,cast:"DEX",d:"Sneak and skill"},

var SPECIES={

dwarf:{n:"Dwarf",d:"+2 CON, hardy",asi:{CON:2}},

dragonborn:{n:"Dragonborn",d:"+2 STR +1 CHA, breath",asi:{STR:2,CHA:1}},
gnome:{n:"Gnome",d:"+2 INT, cunning",asi:{INT:2}},
half_elf:{n:"Half-Elf",d:"+2 CHA, versatile",asi:{CHA:2}},
half_orc:{n:"Half-Orc",d:"+2 STR +1 CON, relentless",asi:{STR:2,CON:1}},
tiefling:{n:"Tiefling",d:"+2 CHA +1 INT, infernal",asi:{CHA:2,INT:1}}};
var BACKGROUNDS={
acolyte:{n:"Acolyte",d:"Temple servant",sk:["insight","religion"]},
criminal:{n:"Criminal",d:"Outside the law",sk:["deception","stealth"]},
folk_hero:{n:"Folk Hero",d:"Local legend",sk:["animal_handling","survival"]},
noble:{n:"Noble",d:"Born to privilege",sk:["history","persuasion"]},
sage:{n:"Sage",d:"Years of study",sk:["arcana","history"]},
soldier:{n:"Soldier",d:"Militia trained",sk:["athletics","intimidation"]}};
var SPELLS=[
{n:"Magic Missile",c:"wizard,sorcerer",l:1,d:"3 force darts, auto-hit, 1d4+1 each"},
{n:"Shield",c:"wizard,sorcerer",l:1,d:"+5 AC reaction"},
{n:"Cure Wounds",c:"cleric,druid,bard,paladin,ranger",l:1,d:"Heal 1d8+mod, touch"},
{n:"Healing Word",c:"cleric,druid,bard",l:1,d:"Heal 1d4+mod, range"},
{n:"Bless",c:"cleric,paladin",l:1,d:"+1d4 to attacks and saves"},
{n:"Burning Hands",c:"wizard,sorcerer",l:1,d:"Cone 3d6 fire, Dex half"},
{n:"Charm Person",c:"bard,druid,sorcerer,warlock,wizard",l:1,d:"Friendly target, Wis save"},
{n:"Sleep",c:"bard,sorcerer,wizard",l:1,d:"5d8 HP fall unconscious"},
{n:"Detect Magic",c:"all",l:1,d:"Sense magic 30 ft"},
{n:"Scorching Ray",c:"wizard,sorcerer",l:2,d:"3 rays, 2d6 fire each"},
{n:"Invisibility",c:"bard,sorcerer,warlock,wizard",l:2,d:"Invisible 1 hour"},
{n:"Hold Person",c:"bard,cleric,druid,sorcerer,warlock,wizard",l:2,d:"Paralyze humanoid"},
{n:"Misty Step",c:"sorcerer,warlock,wizard",l:2,d:"Teleport 30 ft, bonus"},
{n:"Suggestion",c:"bard,sorcerer,warlock,wizard",l:2,d:"Compel reasonable action"},
{n:"Shatter",c:"bard,sorcerer,warlock,wizard",l:2,d:"3d8 thunder, Con half"},
{n:"Fireball",c:"wizard,sorcerer",l:3,d:"8d6 fire, Dex half"},
{n:"Counterspell",c:"sorcerer,warlock,wizard",l:3,d:"Interrupt a spell"},
{n:"Fly",c:"sorcerer,warlock,wizard",l:3,d:"Fly 60 ft, 10 min"},
{n:"Revivify",c:"cleric,druid,paladin,ranger",l:3,d:"Revive, dead under 1 min"},
{n:"Spirit Guardians",c:"cleric",l:3,d:"3d8 radiant aura"},
{n:"Polymorph",c:"bard,druid,sorcerer,wizard",l:4,d:"Turn into a beast"},
{n:"Dimension Door",c:"bard,sorcerer,warlock,wizard",l:4,d:"Teleport in sight"},
{n:"Greater Restoration",c:"bard,cleric,druid",l:4,d:"End condition"},
{n:"Wall of Fire",c:"druid,sorcerer,wizard",l:4,d:"5d8 fire, Dex half"},
{n:"Cone of Cold",c:"sorcerer,wizard",l:5,d:"8d8 cold, Con half"},
{n:"Raise Dead",c:"cleric,paladin,bard",l:5,d:"Revive, dead under 10 days"},
{n:"Disintegrate",c:"sorcerer,wizard",l:6,d:"10d6+40 force, Dex half"},
{n:"Plane Shift",c:"cleric,druid,sorcerer,warlock,wizard",l:7,d:"Travel planes"},
{n:"Teleport",c:"bard,sorcerer,wizard",l:7,d:"Travel the world"},
{n:"Meteor Swarm",c:"sorcerer,wizard",l:9,d:"20d6 fire, Dex half"},
{n:"Wish",c:"sorcerer,wizard",l:9,d:"Anything, once"}];
var MONSTERS=[
{n:"Goblin",cr:"1/4",xp:50,hp:7,ac:15,st:{STR:8,DEX:14,CON:10,INT:10,WIS:8,CHA:8},at:["Scimitar +4, 1d6+2"]},
{n:"Bandit",cr:"1/8",xp:25,hp:11,ac:12,st:{STR:11,DEX:12,CON:12,INT:10,WIS:10,CHA:10},at:["Scimitar +3, 1d6+1"]},
{n:"Skeleton",cr:"1/4",xp:50,hp:13,ac:13,st:{STR:10,DEX:14,CON:15,INT:6,WIS:8,CHA:5},at:["Shortsword +4, 1d6+2"]},
{n:"Zombie",cr:"1/4",xp:50,hp:22,ac:8,st:{STR:13,DEX:6,CON:16,INT:3,WIS:6,CHA:5},at:["Slam +3, 1d6+1"]},
{n:"Wolf",cr:"1/4",xp:50,hp:11,ac:13,st:{STR:12,DEX:15,CON:12,INT:3,WIS:12,CHA:6},at:["Bite +4, 2d4+2"]},
{n:"Orc",cr:"1/2",xp:100,hp:15,ac:13,st:{STR:16,DEX:12,CON:16,INT:7,WIS:11,CHA:10},at:["Greataxe +5, 1d12+3"]},
{n:"Hobgoblin",cr:"1/2",xp:100,hp:11,ac:18,st:{STR:13,DEX:12,CON:12,INT:10,WIS:10,CHA:9},at:["Longsword +3, 1d8+1"]},
{n:"Giant Spider",cr:"1",xp:200,hp:26,ac:14,st:{STR:14,DEX:16,CON:12,INT:2,WIS:11,CHA:4},at:["Bite +5, 1d8+3","Web +5"]},
{n:"Ogre",cr:"2",xp:450,hp:59,ac:11,st:{STR:19,DEX:8,CON:16,INT:5,WIS:7,CHA:7},at:["Greatclub +6, 2d8+4"]},
{n:"Owlbear",cr:"3",xp:700,hp:59,ac:13,st:{STR:20,DEX:12,CON:17,INT:3,WIS:12,CHA:7},at:["Beak +7, 1d10+5","Claws +7, 2d8+5"]},
{n:"Wight",cr:"3",xp:700,hp:45,ac:14,st:{STR:15,DEX:14,CON:16,INT:10,WIS:13,CHA:15},at:["Longsword +4, 1d8+2"]},
{n:"Troll",cr:"5",xp:1800,hp:84,ac:15,st:{STR:18,DEX:13,CON:20,INT:7,WIS:9,CHA:7},at:["Claw +7, 2d6+4","Bite +7, 1d6+4"]},
{n:"Vampire Spawn",cr:"5",xp:1800,hp:82,ac:15,st:{STR:16,DEX:16,CON:16,INT:11,WIS:10,CHA:12},at:["Bite +6, 1d6+3"]},
{n:"Young Red Dragon",cr:"10",xp:5900,hp:178,ac:18,st:{STR:23,DEX:10,CON:21,INT:14,WIS:11,CHA:19},at:["Bite +10, 2d10+6","Breath 16d6"]},
{n:"Lich",cr:"21",xp:33000,hp:135,ac:17,st:{STR:11,DEX:16,CON:16,INT:20,WIS:14,CHA:16},at:["Paralyzing Touch +12, 3d6"]}];
var NAMES={f:["Bryn","Kael","Thora","Eldric","Mira","Fenwick","Isolde","Dain","Lyra","Oswin","Vesper","Garrick","Nym","Sera","Wren","Astrid"],
l:["Ashdown","Emberfell","Thornwood","Greywake","Ironvale","Moonwhisper","Duskbane","Stormhelm","Blackbriar","Frosthold","Silvermoor"]};
var ORACLE=["Yes, and...","Yes","Yes, but...","Unclear - ask again","No, but...","No","No, and..."];
var CONDS=["Blinded","Charmed","Deafened","Frightened","Grappled","Invisible","Poisoned","Prone","Restrained","Stunned","Exhaustion"];
var TABSETS={player:["Character","Inventory","Dice","Spells","Session"],
dm:["Party","Character","Combat","Bestiary","Tools"],
solo:["Character","Inventory","Dice","Spells","Oracle","Combat"]};

/* ================= STATE ================= */
var S={role:"player",theme:"grimoire",chars:[],activeChar:0,log:[],packs:[]};
var route="home", TAB="Character", ADV="norm", UNDO=null, INIT=[], TURN=-1, BLD=null;
function save(){try{localStorage.setItem("grimoire",JSON.stringify(S))}catch(e){}}
function load(){try{var j=JSON.parse(localStorage.getItem("grimoire"));if(j)for(var k in j)S[k]=j[k]}catch(e){}}
function $(i){return document.getElementById(i)}
function C(){return S.chars[S.activeChar]||null}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function md(v){return Math.floor((((+v)||10)-10)/2)}
function sgn(v){return v>=0?"+"+v:String(v)}
function tot(ch,k){var b=(+ch.stats[k])||10;var sp=SPECIES[ch.species];return b+((sp&&sp.asi[k])||0)}
function prof(ch){return 2+Math.floor((((ch.level||1)-1)/4))}
function calcAC(ch){return (CLASSES[ch.cls].hd>=10?16:14)+md(tot(ch,"DEX"))}
function startHP(ch){return CLASSES[ch.cls].hd+md(tot(ch,"CON"))}
function log(m){var t=new Date().toTimeString().slice(0,5);S.log.unshift(t+" - "+m);if(S.log.length>200)S.log.length=200;save()}
function toast(m){var t=$("toast");t.textContent=m;t.className="show";clearTimeout(toast.t);toast.t=setTimeout(function(){t.className=""},2200)}
function modal(h){$("modalBox").innerHTML=h;$("modalWrap").className="open"}
function closeModal(){$("modalWrap").className=""}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function die(s){return 1+Math.floor(Math.random()*s)}

/* ================= DICE ================= */
function roll(expr,label){
 var total=0,parts=[],terms=String(expr).toLowerCase().replace(/\s+/g,"").match(/[+-]?[^+-]+/g)||[];
 var i,t,m,num,sides,kh,keep,rolls,used,sum,j;
 for(i=0;i<terms.length;i++){
  t=terms[i];var neg=(t.charAt(0)==="-");t=t.replace(/^[+-]/,"");
  m=t.match(/^(\d*)d(\d+)(kh|kl)?(\d*)$/);
  if(m){
   num=+(m[1]||1);sides=+m[2];kh=m[3];keep=+(m[4]||1);
   rolls=[];for(j=0;j<num;j++)rolls.push(die(sides));
   used=rolls.slice();
   if(kh){used.sort(function(a,b){return b-a});used=used.slice(0,keep)}
   sum=0;for(j=0;j<used.length;j++)sum+=used[j];
   parts.push((neg?"-":"")+used.join("+"));
   total+=(neg?-1:1)*sum;
  }else if(/^\d+$/.test(t)){total+=(neg?-1:1)*(+t);parts.push((neg?"-":"")+t)}
 }
 var lab=(label||"Roll")+"  ["+expr+"]";
 $("rollLbl").textContent=lab;
 $("rollBig").textContent=total;
 $("rollOv").className="show";
 clearTimeout(roll.t);roll.t=setTimeout(function(){$("rollOv").className=""},1700);
 log(lab+" = "+total);
}

/* ================= RENDER ================= */
function go(r,t){route=r;if(t)TAB=t;render()}
function render(){
 save();document.body.dataset.theme=S.theme;
 if(route==="home")drawHome();
 else if(route==="build")drawBuild();
 else drawApp();
}
function drawHome(){
 var h="<div id='topbar'><h1>Grimoire</h1></div><div id='main'><div class='col'>";
 h+="<div class='card'><h3>Your role</h3><div class='grid3'>";
 var roles=[["player","Player"],["dm","DM"],["solo","Solo"]],i;
 for(i=0;i<3;i++)h+="<div class='pick"+(S.role===roles[i][0]?" on":"")+
  "' onclick=\"S.role='"+roles[i][0]+"';render()\"><b>"+roles[i][1]+"</b></div>";
 h+="</div></div>";
 h+="<button class='pri' onclick='startBuild()'>New Character</button>";
 if(S.chars.length)h+="<button onclick='go(\"app\")'>Continue - "+esc(C()?C().name:"")+"</button>";
 h+="<button onclick='go(\"app\",\"Session\")'>Session Log</button>";
 h+="<button onclick='go(\"app\",\"Tools\")'>Settings and Data</button>";
 h+="<div class='card small dim'>Data lives only on this device. Use Tools to back up.</div>";
 $("app").innerHTML=h+"</div></div>";
}

/* ================= BUILDER ================= */
function startBuild(){
 BLD={step:0,draft:{STR:10,DEX:10,CON:10,INT:10,WIS:10,CHA:10},cost:0,rollSets:[],assigned:0,
 ch:{name:"",species:"human",cls:"fighter",bg:"acolyte",level:1,
 stats:{STR:15,DEX:14,CON:13,INT:12,WIS:10,CHA:8},hp:0,hpMax:0,tempHp:0,
 inv:[{n:"Rations",q:5},{n:"Torch",q:2}],gp:15,atks:[],sk:[],conds:[],conc:"",insp:0,notes:""}};
 route="build";render();
}
var STEPS=["Identity","Class","Species","Background","Scores","Review"];
function drawBuild(){
 var b=BLD,h="<div id='topbar'><button class='ghost' onclick='BLD=null;go(\"home\")'>&lt;</button><h1>"+STEPS[b.step]+"</h1><span class='dim small'>"+(b.step+1)+"/6</span></div><div id='main'><div class='col'>";
 h+=buildStep();
 h+="</div></div><div id='navbar'><button onclick='blBack()'>Back</button><button class='pri' style='flex:2' onclick='blNext()'>"+(b.step===5?"Begin Adventure":"Next")+"</button></div>";
 $("app").innerHTML=h;
}
function blBack(){if(BLD.step>0){BLD.step--;render()}}
function blNext(){
 var b=BLD,c=b.ch;
 if(b.step===0&&!c.name.trim()){toast("Name your character first");return}
 if(b.step===4){
  if(BLD.rollSets.length&&BLD.assigned<6){toast("Assign all rolled scores first");return}
  c.hpMax=startHP(c);c.hp=c.hpMax;
  var am={fighter:[["Longsword","STR","1d8"]],barbarian:[["Greataxe","STR","1d12"]],
  paladin:[["Longsword","STR","1d8"]],ranger:[["Shortbow","DEX","1d6"]],
  rogue:[["Rapier","DEX","1d8"]],monk:[["Unarmed","DEX","1d4"]]};
  c.atks=(am[c.cls]||[["Quarterstaff",md(c.stats.STR)>=md(c.stats.DEX)?"STR":"DEX","1d6"]]).map(function(a){
   return{n:a[0],to:a[1],d:a[2]};});
  if(CLASSES[c.cls].spells)c.slots=slotsFor(c);
 }
 b.step++;
 if(b.step>5){
  S.chars.push(c);S.activeChar=S.chars.length-1;BLD=null;route="app";TAB="Character";
  render();toast("Welcome, "+c.name+"!");
 }else render();
}
function slotsFor(ch){
 var lv=ch.level||1;
 if(ch.cls==="warlock")return[lv<3?1:lv<5?2:lv<7?3:lv<9?4:5,0,0,0,0,0,0,0,0];
 var full=[2,3,4,4,4,3,3,3,3,3,2],n=Math.min(full.length,Math.ceil(lv/2)),r=[],i;
 for(i=0;i<9;i++)r.push(i<n?full[i]:0);return r;
}
function buildStep(){
 var c=BLD.ch,h="",k,e;
 if(BLD.step===0){

  h+="</div>";
 }else if(BLD.step===3){
  for(k in BACKGROUNDS){e=BACKGROUNDS[k];

 }else if(BLD.step===4){
  var cost={9:1,10:2,11:3,12:4,13:5,14:7,15:9};
  h="<div class='card'><h3>Method</h3><div class='grid2'>";
  h+="<div class='pick on' onclick='optStats();render()'><b>Recommended</b><div class='small dim'>Auto for your class</div></div>";
  h+="<div class='pick' onclick='BLD.rollSets=[];BLD.assigned=0;BLD.draft={STR:10,DEX:10,CON:10,INT:10,WIS:10,CHA:10};render()'><b>Point Buy</b><div class='small dim'>Spend 27 points</div></div>";
  h+="<div class='pick' onclick='rollSets()'><b>Roll 4d6</b><div class='small dim'>Roll six sets, tap in order</div></div>";
  h+="</div></div>";
  if(BLD.rollSets.length){
   h+="<div class='card'><h3>Rolls left: "+(6-BLD.assigned)+"</h3>";
   for(k=0;k<6;k++)h+="<button class='grow' style='margin:2px' onclick='pickRoll("+k+")'>"+BLD.rollSets[k]+"</button>";
   h+="</div>";
  }
  if(BLD.cost>0||true){
   h+="<div class='card'><h3>Points: "+(27-BLD.cost)+" / 27</h3>";
   for(k=0;k<6;k++){var a=AKEYS[k];
    h+="<div class='row'><b style='width:40px'>"+a+"</b><button onclick='pbAdj(\""+a+"\",-1)'>-</button><b style='width:30px;text-align:center'>"+BLD.draft[a]+"</b><button onclick='pbAdj(\""+a+"\",1)'>+</button></div>";
   }
   h+="</div>";
  }
  h+="<div class='grid3'>";
  for(k=0;k<6;k++){var a2=AKEYS[k];
   h+="<div class='statbox'><b>"+(BLD.rollSets.length&&BLD.assigned>k?BLD.ch.stats[a2]:BLD.draft[a2])+"</b><span>"+a2+"</span></div>";}
  h+="</div>";
 }else if(BLD.step===5){
  var cl=CLASSES[c.cls],sp=SPECIES[c.species],bg=BACKGROUNDS[c.bg],hp=startHP(c);
  h="<div class='card'><b>"+esc(c.name)+"</b><div class='small dim'>Level "+c.level+" - "+sp.n+" - "+cl.n+" - "+bg.n+"</div></div>";
  h+="<div class='grid3'>";

  h+="</div>";

  h+="<button class='pri' onclick='blNext()'>Begin the adventure</button>";
 }
 return h;
}
function optStats(){
 var P={fighter:{STR:15,DEX:13,CON:14,INT:8,WIS:12,CHA:10},
 barbarian:{STR:15,DEX:13,CON:14,INT:8,WIS:12,CHA:10},
 paladin:{STR:15,DEX:10,CON:13,INT:8,WIS:12,CHA:14},
 ranger:{STR:12,DEX:15,CON:13,INT:8,WIS:14,CHA:10},
 rogue:{STR:8,DEX:15,CON:13,INT:14,WIS:10,CHA:12},
 monk:{STR:12,DEX:15,CON:13,INT:8,WIS:14,CHA:10},
 wizard:{STR:8,DEX:13,CON:14,INT:15,WIS:12,CHA:10},
 sorcerer:{STR:8,DEX:13,CON:14,INT:10,WIS:12,CHA:15},
 warlock:{STR:8,DEX:13,CON:14,INT:10,WIS:12,CHA:15},
 cleric:{STR:13,DEX:10,CON:14,INT:8,WIS:15,CHA:12},
 druid:{STR:8,DEX:13,CON:14,INT:12,WIS:15,CHA:10},

}
function randAll(){
 var ks=["human","elf","dwarf","halfling","dragonborn","gnome","half_elf","half_orc","tiefling"];
 var cs=[];for(var k in CLASSES)cs.push(k);var bs=[];for(k in BACKGROUNDS)bs.push(k);
 BLD.ch.name=rnd(NAMES.f)+" "+rnd(NAMES.l);
 BLD.ch.species=rnd(ks);BLD.ch.cls=rnd(cs);BLD.ch.bg=rnd(bs);
 BLD.ch.sk=BACKGROUNDS[BLD.ch.bg].sk.slice();
 optStats();render();
}
function rollSets(){
 BLD.rollSets=[];BLD.assigned=0;
 for(var i=0;i<6;i++){
  var r=[die(6),die(6),die(6),die(6)].sort(function(a,b){return b-a});
  BLD.rollSets.push(r[0]+r[1]+r[2]+" ("+r.join(",")+" drop "+r[3]+")");
 }
 render();
}
function pickRoll(i){
 var k=AKEYS[BLD.assigned];
 BLD.ch.stats[k]=parseInt(BLD.rollSets[i]);BLD.assigned++;
 if(BLD.assigned>=6){BLD.rollSets=[];}
 render();
}
function pbAdj(k,d){
 var cost={8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};
 var v=BLD.draft[k]+d;
 if(v<8||v>15)return;
 if(27-BLD.cost-(cost[v]-cost[BLD.draft[k]])<0)return;
 BLD.cost+=cost[v]-cost[BLD.draft[k]];BLD.draft[k]=v;BLD.ch.stats[k]=v;render();
}

 h+="<div class='row' style='margin-top:8px'><button class='grow small' onclick='setTemp()'>Temp HP: "+(ch.tempHp||0)+"</button><button class='grow small' onclick='setConc()'>"+(ch.conc?"Conc: "+esc(ch.conc):"Concentration")+"</button></div></div>";

 h+="</div>";

 for(k=0;k<6;k++){var a=AKEYS[k],m=md(tot(ch,a));
  h+="<div class='statbox' onclick='checkModal(\""+a+"\","+m+")'><b>"+tot(ch,a)+"</b><span>"+a+" "+sgn(m)+"</span></div>";}
 h+="</div>";
 h+="<div class='row' style='margin-top:6px'><span class='tag"+(ADV==="norm"?"":" on")+"' onclick='ADV=ADV===\"norm\"?\"adv\":ADV===\"adv\"?\"dis\":\"norm\";render()'>Adv: "+(ADV==="norm"?"Normal":ADV==="adv"?"Adv":"Dis")+"</span>";
 h+="<span class='tag"+(ch.insp?" on":"")+"' onclick='C().insp=C().insp?0:1;render()'>Inspiration</span></div>";

 for(k in SKILLS){var p=ch.sk.indexOf(k)>=0,b=md(tot(ch,SKILLS[k]))+(p?prof(ch):0);
  h+="<div onclick='roll(\"1d20+"+b+"\",\""+k.replace(/_/g," ")+"\")'><span style='color:"+(p?"var(--accent)":"var(--dim)")+"'>"+(p?"*":"-")+"</span> "+k.replace(/_/g," ")+" <span class='dim' style='float:right'>"+sgn(b)+" ("+SKILLS[k]+")</span></div>";}
 h+="</div></div>";

 for(i=0;i<ch.atks.length;i++){var at=ch.atks[i];

 h+="</div></div>";
 h+="<div class='card'><h3>Notes</h3><textarea rows='3' onchange='C().notes=this.value;save()'>"+esc(ch.notes)+"</textarea></div>";

function adjHP(d){
 var ch=C();UNDO={hp:ch.hp,tp:ch.tempHp};
 if(d>0)ch.hp=Math.min(ch.hpMax,ch.hp+1);
 else{if(ch.tempHp>0)ch.tempHp--;else ch.hp=Math.max(0,ch.hp-1);}
 save();render();
}
function setHP(){
 modal("<h3>Set HP</h3><input id='mi' type='number' value='"+C().hp+"'><button class='pri' style='margin-top:8px' onclick='C().hp=Math.max(0,Math.min(C().hpMax,+$(\"mi\").value||0));save();closeModal();render()'>OK</button>");
}
function setTemp(){
 modal("<h3>Temp HP</h3><input id='mi' type='number' value='"+(C().tempHp||0)+"'><button class='pri' style='margin-top:8px' onclick='C().tempHp=Math.max(0,+$(\"mi\").value||0);save();closeModal();render()'>OK</button>");

function setConc(){
 modal("<h3>Concentration</h3><input id='mi' value='"+esc(C().conc)+"'><button class='pri' style='margin-top:8px' onclick='C().conc=$(\"mi\").value.trim();save();closeModal();render()'>OK</button>");

function restHTML(){

function doRest(long){
 var ch=C();
 if(long){ch.hp=ch.hpMax;ch.tempHp=0;ch.conds=[];ch.conc="";log(ch.name+" long rest");}
 else{ch.hp=Math.min(ch.hpMax,ch.hp+die(6)+Math.floor(ch.level/2));log(ch.name+" short rest");}
 if(CLASSES[ch.cls].spells)ch.slots=slotsFor(ch);
 save();closeModal();render();
}
function togCond(cn){

function spList(ch,q){

function startEnc(){

 if(C())INIT.push({name:C().name,hp:C().hp,ac:calcAC(C()),init:die(20),isPC:1});

function addMons(){
 var n=$("mi").value.trim(),cnt=Math.min(20,Math.max(1,+$("mq").value||1)),m=null,i;
 for(i=0;i<MONSTERS.length;i++)if(MONSTERS[i].n.toLowerCase()===n.toLowerCase())m=MONSTERS[i];
 if(!m){toast("Not found");return}
 for(i=0;i<cnt;i++)INIT.push({name:m.n+(cnt>1?" "+(i+1):""),hp:m.hp,ac:m.ac,init:die(20)});
 INIT.sort(function(a,b){return b.init-a.init});TURN=0;
 log(cnt+"x "+m.n+" encounter");closeModal();render();
}
function hitInit(i,d){
 INIT[i].hp+=d;
 if(INIT[i].hp<=0){log(INIT[i].name+" falls");INIT.splice(i,1);if(TURN>=i)TURN=Math.min(TURN,INIT.length-1);}
 save();render();
}

}
function genNPC(){
 modal("<h3>NPC</h3><b>"+rnd(NAMES.f)+" "+rnd(NAMES.l)+"</b><div class='small dim' style='margin-top:6px'>"+rnd(["owes money to the wrong people","knows a mountain shortcut","is secretly a retired adventurer","seeks a lost sibling","guards a family secret","will betray you for the right price"])+"</div>");
}

/* ================= PARTY & TOOLS ================= */
function partyHTML(){
 var h="";
 for(var i=0;i<S.chars.length;i++){var ch=S.chars[i];
  h+="<div class='irow' onclick='S.activeChar="+i+";TAB=\"Character\";render()'><b class='grow'>"+esc(ch.name)+"</b><span class='small dim'>"+CLASSES[ch.cls].n+"</span><b>"+ch.hp+"/"+ch.hpMax+"</b></div>";}
 h+="<button class='pri grow' onclick='startBuild()'>New Character</button>";
 return h||"<div class='card dim'>No characters.</div>";
}
function toolsHTML(){
 var h="<div class='card'><h3>Theme</h3><div class='grid3'>";
 var th=[["grimoire","Grimoire"],["elven","Elven"],["abyssal","Abyssal"]];
 for(var i=0;i<3;i++)h+="<div class='pick"+(S.theme===th[i][0]?" on":"")+"' onclick='S.theme=\""+th[i][0]+"\";render()'><b>"+th[i][1]+"</b></div>";
 h+="</div></div>";
 h+="<div class='card'><h3>Backups</h3><div class='grid2'><button onclick='doExport()'>Export All</button><label class='pick' style='text-align:center'>Restore<input type='file' accept='.json' hidden onchange='doImport(this.files[0])'></label></div></div>";
 h+="<div class='card'><button class='ghost' style='color:var(--danger)' onclick='modal(\"<h3>Erase everything?</h3><div class=grid2><button class=pri onclick=localStorage.removeItem(\\\"grimoire\\\");location.reload()>Yes</button><button onclick=closeModal()>No</button></div>\")'>Erase everything</button></div>";
 return h;
}
function doExport(){
 var a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
 a.download="grimoire-backup.json";a.click();
}
function doImport(f){
 if(!f)return;var r=new FileReader();
 r.onload=function(){try{var j=JSON.parse(r.result);if(j&&j.chars){S=j;save();render();toast("Restored")}else toast("Invalid")}catch(e){toast("Bad file")}};
 r.readAsText(f);
}

/* ================= BOOT ================= */
load();
render();
</script>
</body>
</html>
